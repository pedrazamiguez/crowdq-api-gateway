spring:

  data:
    redis:
      host: ${REDIS_HOST:redis}

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: http://auth-service:8080
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=1
                - AddRequestHeader=X-Request-Source, gateway
            - id: user-service
              uri: http://user-service:8080
              predicates:
                - Path=/api/users/**
              filters:
                - StripPrefix=1
            - id: event-service
              uri: http://event-service:8080
              predicates:
                - Path=/api/events/**
              filters:
                - StripPrefix=1
            - id: question-service
              uri: http://question-service:8080
              predicates:
                - Path=/api/questions/**
              filters:
                - StripPrefix=1
            - id: moderation-service
              uri: http://moderation-service:8080
              predicates:
                - Path=/api/moderation/**
              filters:
                - StripPrefix=1
            - id: analytics-service
              uri: http://analytics-service:8080
              predicates:
                - Path=/api/analytics/**
              filters:
                - StripPrefix=1
            - id: notification-service
              uri: http://notification-service:8080
              predicates:
                - Path=/api/notifications/**
              filters:
                - StripPrefix=1
          default-filters:
            - TokenRelay=
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://auth-service:8080/realms/crowdq
