server:
  port: 58000

spring:

  data:
    redis:
      host: localhost

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: http://localhost:59000
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=1
                - AddRequestHeader=X-Request-Source, gateway
            - id: user-service
              uri: http://localhost:59100
              predicates:
                - Path=/api/users/**
              filters:
                - StripPrefix=1
            - id: event-service
              uri: http://localhost:59200
              predicates:
                - Path=/api/events/**
              filters:
                - StripPrefix=1
            - id: question-service
              uri: http://localhost:59300
              predicates:
                - Path=/api/questions/**
              filters:
                - StripPrefix=1
                - name: CircuitBreaker
                  args:
                    name: questionServiceCircuitBreaker
                    fallbackUri: forward:/fallback/questions
                - name: Retry
                  args:
                    retries: 3
                    statuses: BAD_GATEWAY
                    methods: GET
            - id: moderation-service
              uri: http://localhost:59400
              predicates:
                - Path=/api/moderation/**
              filters:
                - StripPrefix=1
            - id: analytics-service
              uri: http://localhost:59500
              predicates:
                - Path=/api/analytics/**
              filters:
                - StripPrefix=1
            - id: notification-service
              uri: http://localhost:59600
              predicates:
                - Path=/api/notifications/**
              filters:
                - StripPrefix=1
          default-filters:
            - TokenRelay=
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"

resilience4j:
  circuitbreaker:
    instances:
      questionServiceCircuitBreaker:
        registerHealthIndicator: true
        slidingWindowSize: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2
        minimumNumberOfCalls: 5
